name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --check bambu-lan-rename.js
      # Install the packed tarball the way npx does, and run the command.
      - run: npx --yes --package "./$(npm pack --silent)" bambu-lan-rename --help
